<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study</title>

    <script type="importmap">
        {
            "imports": {
                "@utils/": "./core/utils/",
                "@jspsych/": "./core/jspsych/",
                "@tasks/": "./tasks/",
                "@api/": "./api/",
                "@images/": "./assets/images/"
            }
        }
    </script>
    
    <!-- jsPsych Core Files -->
    <script src="core/jspsych/jspsych.js"></script>
    <script src="core/jspsych/plugin-html-keyboard-response.js"></script>
    <script src="core/jspsych/plugin-html-button-response.js"></script>
    <script src="core/jspsych/plugin-instructions.js"></script>
    <script src="core/jspsych/plugin-preload.js"></script>
    <script src="core/jspsych/plugin-call-function.js"></script>
    <script src="core/jspsych/plugin-fullscreen.js"></script>
    <script src="core/jspsych/plugin-survey-multi-choice.js"></script>
    <script src="core/jspsych/plugin-survey-likert.js"></script>

    
    <!-- Task-specific files -->
    <script src="tasks/card-choosing/plugin-card-choosing.js"></script>

    
    <!-- Core utilities -->
    <script type="module" src="core/utils/index.js"></script>

    <!-- CSS Styles -->
    <link href="core/jspsych/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        #display_element {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .instructions p {
            width: 700px;
            text-align: left;
            margin: 1em 0;
        }
    </style>
</head>
<body>
    <div id="display_element"></div>
    
    <script type="module">
        // Import task registry functions
        import { createModuleTimeline, getModuleInfo } from '@api/index.js';
        import { enterExperiment, initFirebase, initSaveData, saveTrial, endExperiment } from '@utils/index.js';

        const MODULE_NAME = 'oestrogen_battery';

        // Get parameters from URL
        const params = new URLSearchParams(window.location.search);
        window.participantID = params.get('participant_id') || '';
        window.session = params.get('session') || 'wk0';
        window.module = MODULE_NAME;

        // Simulated runs do not write to Firestore unless ?firebase=1 is set,
        // so test runs cannot pollute the datastore.
        window.simulating = window.participantID.includes("simulate");

        // A "debug" participant ID relaxes the participation guards: no
        // fullscreen enforcement, no navigation blocking. Read by
        // core/utils/participation-validation.js.
        window.debug = window.participantID.includes("debug");
        const dryRun = window.simulating && params.get('firebase') !== '1';

        // Initialize jsPsych
        window.jsPsych = initJsPsych({
            display_element: 'display_element',
            // Fires once per trial, after that trial's own on_finish. This is
            // the entire trial-to-trial persistence mechanism.
            on_data_update: (data) => saveTrial(data),
            // Runs after the last trial's data has been handed to
            // on_data_update, so nothing is left unsaved.
            on_finish: async function() {
                const display = jsPsych.getDisplayElement();
                display.innerHTML =
                    '<p>Saving your data - please do not close this window.</p>';
                try {
                    await endExperiment();
                } catch (error) {
                    console.error('Error finalising session:', error);
                }
                display.innerHTML =
                    '<p>Thank you for participating! Please call the experimenter.</p>';
            }
        });

        const settings = {
            sequence: window.session,
            session: window.session
        };

        function showError(heading, detail) {
            jsPsych.getDisplayElement().innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h2>${heading}</h2>
                    <p><strong>${detail}</strong></p>
                    <p>Please call the experimenter.</p>
                </div>
            `;
        }

        // Function to run the experiment
        async function runExperiment() {
            // Establish identity and the data sink before any trial can run.
            try {
                await initFirebase(window.participantID, window.session);
                await initSaveData({
                    participantID: window.participantID,
                    session: window.session,
                    module: MODULE_NAME,
                    simulate: dryRun
                });
            } catch (error) {
                console.error('Firebase initialisation failed:', error);
                showError('Could not connect to the data server', error.message);
                return;
            }

            try {
                console.log('Module info:', getModuleInfo(MODULE_NAME));

                const timeline = await createModuleTimeline(MODULE_NAME, settings);
                console.log('Timeline created:', timeline);

                const exitFullscreen = {
                    type: jsPsychFullscreen,
                    fullscreen_mode: false
                };

                // Debug and simulated runs skip the fullscreen switch but keep
                // the trial, so URL parameters and the warning counter are still
                // recorded. fullscreen_mode:false renders no button, so there is
                // nothing for a simulated run to click - skip simulating it and
                // let the plugin end the trial on its own timer.
                const startTrial = (window.debug || window.simulating)
                    ? { ...enterExperiment, fullscreen_mode: false,
                        simulation_options: { simulate: false } }
                    : enterExperiment;

                const fullTimeline = [
                    startTrial,
                    ...timeline,
                    exitFullscreen
                ];

                if (window.simulating) {
                    console.log('Simulating experiment run...');
                    await jsPsych.simulate(fullTimeline, "visual", {
                        default: {
                            data: {
                                rt: 200,
                                speed_up: true,
                                speed_up_factor: 10,
                            }
                        }
                    });
                } else {
                    console.log('Running experiment...');
                    await jsPsych.run(fullTimeline);
                }

            } catch (error) {
                console.error('Error running experiment:', error);
                showError('Error Loading Experiment', error.message);
            }
        }

        // Start the experiment when the page loads
        window.addEventListener('load', runExperiment);
    </script>
</body>
</html>
